<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark circle background with golden glow -->
  <circle cx="32" cy="32" r="30" fill="#14100C" stroke="#C8941A" stroke-width="2"/>
  <!-- Sun / Rays crown -->
  <circle cx="32" cy="19" r="5" fill="#E6B84A"/>
  <line x1="32" y1="9" x2="32" y2="12" stroke="#E6B84A" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="25" y1="12" x2="27" y2="14.5" stroke="#E6B84A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="12" x2="37" y2="14.5" stroke="#E6B84A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Golden Pyramid -->
  <polygon points="32,23 50,49 14,49" fill="#C8941A"/>
  <polygon points="32,23 50,49 32,49" fill="#E6B84A" opacity="0.3"/>
  <!-- Base accent line -->
  <line x1="12" y1="51" x2="52" y2="51" stroke="#E6B84A" stroke-width="2" stroke-linecap="round"/>
</svg>
